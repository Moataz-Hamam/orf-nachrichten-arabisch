<!DOCTYPE html>
<html>
<head>
    <title>Nachrichten auf Arabisch</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #1a1a1a;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .nachrichten-karte {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .nachrichten-karte h2 {
            margin-top: 0;
            font-size: 1.2em;
            color: #1a1a1a;
        }

        .nachrichten-karte p {
            font-size: 1.1em;
            color: #333;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Nachrichten auf Arabisch</h1>
    <div id="nachrichten-bereich"></div>

    <script>
    fetch("nachrichten.json")
    .then(antwort => antwort.json())
    .then(daten => {
        const bereich = document.getElementById("nachrichten-bereich");

        for (const nachricht of daten) {
            const karte = "<div class='nachrichten-karte'>" +
                "<h2>" + nachricht.titel_original + "</h2>" +
                "<p dir='rtl'>" + nachricht.titel_arabisch + "</p>" +
                "</div>";
            bereich.innerHTML += karte;
        }
    });
    </script>
</body>
</html>
